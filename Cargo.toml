[package]
name = "SSSniffer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
detours-rs = "0.2.0"
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart"] }
rbase64 = "2.0.3"
mime_guess = "2"
mlua = { version = "0.11", features = ["lua53", "vendored", "error-send"] }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
walkdir = "2"
windows = { version = "0.62.2", features = ["Win32", "Win32_Storage", "Win32_System", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_Diagnostics", "Win32_System_Diagnostics_Debug", "Win32_Globalization"] }
